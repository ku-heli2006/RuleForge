server:
  port: ${PORT:8080}
  max-http-request-header-size: 16KB
spring:
  application:
    name: ruleforge-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ruleforge}
    username: ${DATABASE_USERNAME:ruleforge}
    password: ${DATABASE_PASSWORD:ruleforge}
  flyway:
    enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
