services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ruleforge
      POSTGRES_USER: ruleforge
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-ruleforge}
    ports:
      - "5432:5432"
    volumes:
      - ruleforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruleforge -d ruleforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/ruleforge
      DATABASE_USERNAME: ruleforge
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-ruleforge}
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_DEMO_MODE: "false"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  ruleforge-postgres:
